<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOOM: Hellgate</title>
<style>
:root{--red:#d92820;--gold:#f4c542;--dark:#080808;--panel:#181818}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:monospace}body{display:grid;place-items:center}#game{position:relative;width:100vw;height:100vh;background:#111}canvas{display:block;width:100%;height:calc(100% - 92px);image-rendering:pixelated}#hud{height:92px;display:flex;align-items:center;gap:18px;padding:10px 18px;background:linear-gradient(#282828,#0c0c0c);border-top:3px solid var(--red);color:var(--gold)}.stat{min-width:95px}.label{font-size:11px;color:#fff;opacity:.75;letter-spacing:2px}.value{font-size:22px;font-weight:bold}.bar{height:12px;width:140px;margin-top:4px;border:2px solid #aaa;background:#000}.fill{height:100%;background:var(--red);width:100%}#ammoFill{background:var(--gold)}#help{position:absolute;z-index:3;top:14px;left:14px;padding:8px 10px;background:#000b;border:1px solid var(--gold);font-size:12px;line-height:1.55;color:var(--gold)}#message{position:absolute;inset:0;display:grid;place-items:center;background:#000b;text-align:center;z-index:5}.card{padding:28px 36px;border:3px solid var(--red);background:#111;color:var(--gold);box-shadow:0 0 35px #f00a}.card h1{margin:0 0 10px;color:var(--red);font-size:42px;letter-spacing:4px}.card p{margin:8px 0 20px;color:#fff}.card button{cursor:pointer;padding:10px 24px;background:var(--red);border:0;color:#fff;font:bold 16px monospace}.hidden{display:none!important}
</style>
</head>
<body>
<div id="game">
<canvas id="screen"></canvas>
<div id="help">WASD / ARROWS: MOVE<br>CLICK: FIRE &nbsp; ESC: PAUSE</div>
<div id="message"><div class="card"><h1>HELLGATE</h1><p>Click to enter the demon-infested maze.</p><button id="start">START GAME</button></div></div>
<div id="hud"><div class="stat"><div class="label">HEALTH</div><div class="bar"><div id="healthFill" class="fill"></div></div><div id="health" class="value">100</div></div><div class="stat"><div class="label">AMMO</div><div class="bar"><div id="ammoFill" class="fill"></div></div><div id="ammo" class="value">40</div></div><div class="stat"><div class="label">KILLS</div><div id="kills" class="value">0</div></div><div class="stat"><div class="label">SCORE</div><div id="score" class="value">0</div></div><div class="stat"><div class="label">WAVE</div><div id="wave" class="value">1</div></div></div>
</div>
<script>
'use strict';
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d'),keys={};
const state={running:false,paused:false,last:0,health:100,ammo:40,kills:0,score:0,wave:1,player:{x:3.5,y:3.5,a:0},enemies:[]};
const map=["1111111111111111","1000000000000001","1011110111111101","1000010100000101","1011010101110101","1001010001010001","1101011101011111","1001000101000001","1011110101111101","1000000100000001","1011111111111101","1000000000000001","1111111111111111"].map(r=>r.split('').map(Number));
const W=map[0].length,H=map.length,FOV=Math.PI/3;
function resize(){canvas.width=Math.max(320,innerWidth);canvas.height=Math.max(240,innerHeight-92)}addEventListener('resize',resize);resize();
function wall(x,y){return x<0||y<0||x>=W||y>=H||map[y|0][x|0]===1}
function spawn(){state.enemies=[];for(let i=0;i<state.wave+2;i++){let x,y;do{x=1.5+Math.random()*(W-3);y=1.5+Math.random()*(H-3)}while(wall(x,y)||Math.hypot(x-state.player.x,y-state.player.y)<4);state.enemies.push({x,y,hp:2,hit:0,attack:0})}}
function move(dx,dy){let r=.2;if(!wall(state.player.x+dx+r*Math.sign(dx),state.player.y)&&!wall(state.player.x+dx-r*Math.sign(dx),state.player.y))state.player.x+=dx;if(!wall(state.player.x,state.player.y+dy+r*Math.sign(dy))&&!wall(state.player.x,state.player.y+dy-r*Math.sign(dy)))state.player.y+=dy}
function cast(a){let x=state.player.x,y=state.player.y,dx=Math.cos(a),dy=Math.sin(a),d=0;while(d<20){d+=.025;x+=dx*.025;y+=dy*.025;if(wall(x,y))break}return d}
function shoot(){if(!state.running||state.paused||state.ammo<=0)return;state.ammo--;let best=null,bd=Infinity;for(const e of state.enemies){let dx=e.x-state.player.x,dy=e.y-state.player.y,d=Math.hypot(dx,dy),diff=Math.abs(Math.atan2(Math.sin(Math.atan2(dy,dx)-state.player.a),Math.cos(Math.atan2(dy,dx)-state.player.a)));if(diff<.11&&d<bd&&cast(Math.atan2(dy,dx))>d-.2){best=e;bd=d}}if(best){best.hp--;best.hit=.15;if(best.hp<=0){state.enemies.splice(state.enemies.indexOf(best),1);state.kills++;state.score+=100;if(!state.enemies.length){state.wave++;spawn()}}}}
function update(dt){if(!state.running||state.paused)return;let speed=dt*2.8,dx=0,dy=0;if(keys.w||keys.arrowup){dx+=Math.cos(state.player.a);dy+=Math.sin(state.player.a)}if(keys.s||keys.arrowdown){dx-=Math.cos(state.player.a);dy-=Math.sin(state.player.a)}if(keys.a){dx+=Math.cos(state.player.a-Math.PI/2);dy+=Math.sin(state.player.a-Math.PI/2)}if(keys.d){dx+=Math.cos(state.player.a+Math.PI/2);dy+=Math.sin(state.player.a+Math.PI/2)}let l=Math.hypot(dx,dy);if(l)move(dx/l*speed,dy/l*speed);for(const e of state.enemies){let ex=state.player.x-e.x,ey=state.player.y-e.y,d=Math.hypot(ex,ey);if(d>1.1){let s=dt*.55;let nx=e.x+ex/d*s,ny=e.y+ey/d*s;if(!wall(nx,e.y))e.x=nx;if(!wall(e.x,ny))e.y=ny}e.attack-=dt;if(d<5&&e.attack<=0){state.health-=8;e.attack=1.1;if(state.health<=0){state.health=0;state.running=false;end('YOU DIED')}}e.hit=Math.max(0,e.hit-dt)}}
function render(){let w=canvas.width,h=canvas.height;ctx.fillStyle='#111827';ctx.fillRect(0,0,w,h/2);ctx.fillStyle='#32251f';ctx.fillRect(0,h/2,w,h/2);let n=Math.ceil(w/3);for(let i=0;i<n;i++){let a=state.player.a-FOV/2+i/n*FOV,d=cast(a)*Math.cos(a-state.player.a),wh=Math.min(h*2,h/d*.75),shade=Math.max(25,190-d*12)|0;ctx.fillStyle=`rgb(${shade},${shade*.38|0},${shade*.28|0})`;ctx.fillRect(i*3,(h-wh)/2,4,wh)}let sprites=state.enemies.map(e=>{let dx=e.x-state.player.x,dy=e.y-state.player.y;return{e,d:Math.hypot(dx,dy),a:Math.atan2(dy,dx)}}).sort((a,b)=>b.d-a.d);for(const s of sprites){let diff=Math.atan2(Math.sin(s.a-state.player.a),Math.cos(s.a-state.player.a));if(Math.abs(diff)>FOV/2+.15||cast(s.a)<s.d-.2)continue;let x=w/2+diff/FOV*w,y=h/2,sz=Math.min(h*1.2,h/s.d*.65);ctx.fillStyle=s.e.hit?'#fff':'#a20d18';ctx.fillRect(x-sz*.25,y-sz*.5,sz*.5,sz);ctx.fillStyle='#ffcc99';ctx.fillRect(x-sz*.18,y-sz*.7,sz*.36,sz*.25);ctx.fillStyle='#000';ctx.fillRect(x-sz*.1,y-sz*.62,sz*.06,sz*.06);ctx.fillRect(x+sz*.04,y-sz*.62,sz*.06,sz*.06)}ctx.strokeStyle='#f4c542';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w/2-10,h/2);ctx.lineTo(w/2+10,h/2);ctx.moveTo(w/2,h/2-10);ctx.lineTo(w/2,h/2+10);ctx.stroke();document.getElementById('health').textContent=Math.ceil(state.health);document.getElementById('ammo').textContent=state.ammo;document.getElementById('kills').textContent=state.kills;document.getElementById('score').textContent=state.score;document.getElementById('wave').textContent=state.wave;document.getElementById('healthFill').style.width=state.health+'%';document.getElementById('ammoFill').style.width=state.ammo/40*100+'%'}
function end(title){document.querySelector('#message h1').textContent=title;document.querySelector('#message p').textContent=`KILLS: ${state.kills}  SCORE: ${state.score}`;document.getElementById('start').textContent='RESTART';document.getElementById('message').classList.remove('hidden')}
function loop(t){let dt=Math.min(.05,(t-state.last)/1000);state.last=t;update(dt);render();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape')state.paused=!state.paused});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);canvas.addEventListener('click',shoot);document.getElementById('start').onclick=()=>{state.health=100;state.ammo=40;state.kills=0;state.score=0;state.wave=1;state.player={x:3.5,y:3.5,a:0};state.running=true;state.paused=false;spawn();document.getElementById('message').classList.add('hidden')};spawn();requestAnimationFrame(loop);
</script>
</body>
</html>
